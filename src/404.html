<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found &middot; vrontend</title>
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <!--
    Served by hashttp when no route and no static file match, i.e. a hard
    reload on an unknown path. Client-side navigation never reaches this page:
    it renders src/assets/js/domain/notfound/view.jsx instead.
  -->
  <main class="layout__main">
    <section class="panel panel--center">
      <p class="notfound__code">404</p>
      <h1 class="notfound__title">Page Not Found</h1>
      <p class="notfound__text">This path does not match any route.</p>
      <a class="button" href="/">Back to Tasks</a>
    </section>
  </main>
</body>
</html>
